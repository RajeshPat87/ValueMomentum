# Jobs run in PARALLEL unless dependsOn is set
trigger: [main]

pool:
  vmImage: ubuntu-latest

jobs:
- job: BicepLint
  displayName: Bicep build
  steps:
  - script: az bicep build -f kit/bicep/main.bicep

- job: TerraformLint
  displayName: Terraform fmt/validate
  steps:
  - script: |
      cd kit/terraform
      terraform fmt -check -recursive
      terraform init -backend=false
      terraform validate

- job: ScriptTests
  strategy:
    matrix:
      py310: { pythonVersion: '3.10' }
      py312: { pythonVersion: '3.12' }
    maxParallel: 2
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
  - script: python --version

- job: Package
  dependsOn: [BicepLint, TerraformLint, ScriptTests]   # fan-in
  condition: succeeded()
  timeoutInMinutes: 20
  steps:
  - task: CopyFiles@2
    inputs:
      Contents: |
        kit/bicep/**
        kit/terraform/**
      TargetFolder: $(Build.ArtifactStagingDirectory)
  - publish: $(Build.ArtifactStagingDirectory)
    artifact: iac
